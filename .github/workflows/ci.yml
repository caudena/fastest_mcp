name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hermetic-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4"

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Check whitespace
        run: git diff --check

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile development code without warnings
        run: mix compile --warnings-as-errors

      - name: Compile test code without warnings
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run hermetic native test suite
        run: mix test --exclude external_auth --exclude conformance --exclude docs_examples

  docs-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4"

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Build HexDocs without warnings
        run: mix docs --warnings-as-errors

  docs-examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4"

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Run docs example harness
        run: mix test --only docs_examples --exclude external_auth --exclude conformance

  conformance-server:
    needs: hermetic-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/conformance/package-lock.json

      - name: Install locked Elixir dependencies
        run: mix deps.get --check-locked

      - name: Install pinned conformance runner
        working-directory: test/conformance
        run: npm ci

      - name: Verify pinned conformance runner
        working-directory: test/conformance
        run: test "$(npx --no-install conformance --version)" = "0.2.0-alpha.11"

      - name: Run frozen core requirements and selected server extensions
        env:
          MCP_CONFORMANCE_OUTPUT_DIR: ${{ runner.temp }}/conformance-server
        run: >-
          mix test
          test/fastest_mcp/conformance_test.exs
          --include conformance --exclude external_auth

      - name: Upload server conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-server-${{ github.sha }}
          path: ${{ runner.temp }}/conformance-server
          if-no-files-found: warn
          retention-days: 14

  conformance-client:
    needs: hermetic-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/conformance/package-lock.json

      - name: Install locked Elixir dependencies
        run: mix deps.get --check-locked

      - name: Install pinned conformance runner
        working-directory: test/conformance
        run: npm ci

      - name: Verify pinned conformance runner
        working-directory: test/conformance
        run: test "$(npx --no-install conformance --version)" = "0.2.0-alpha.11"

      - name: Run frozen core requirements and selected client extensions
        env:
          MCP_CONFORMANCE_OUTPUT_DIR: ${{ runner.temp }}/conformance-client
        run: >-
          mix test
          test/fastest_mcp/conformance_client_test.exs
          --include conformance --exclude external_auth

      - name: Upload client conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-client-${{ github.sha }}
          path: ${{ runner.temp }}/conformance-client
          if-no-files-found: warn
          retention-days: 14

  package:
    needs:
      - hermetic-test
      - docs-build
      - docs-examples
      - conformance-server
      - conformance-client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.4"

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Build and verify one fresh package candidate
        run: ./scripts/package_smoke.sh "$RUNNER_TEMP/fastest-mcp-package-artifacts"

      - name: Upload the verified package candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: fastest-mcp-package-${{ github.sha }}
          path: ${{ runner.temp }}/fastest-mcp-package-artifacts
          if-no-files-found: error
          retention-days: 14
